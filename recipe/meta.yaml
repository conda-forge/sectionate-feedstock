{% set name = "sectionate" %}
{% set version = "0.3.5" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sectionate/sectionate-{{ version }}.tar.gz
  sha256: 1f8062b775cad27a1aa53ff4642b260bdccf1096db1324b267905a23c54e4b31

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - dask
    - numba
    - numpy
    - scipy
    - xarray
    - xgcm >=0.9.0,<0.10

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - sectionate
  commands:
    - pip check

about:
  home: https://github.com/MOM6-community/sectionate
  summary: A package to sample grid-consistent sections from ocean model outputs
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hdrake
